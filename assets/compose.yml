# 托管运行时专用；凭据通过子进程环境传入，不写入包内。
services:
  pansou:
    image: "${RB_IMAGE:?}"
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      dev.reel-bridge.owner: "${RB_OWNER:?}"
    ports:
      - "127.0.0.1:${RB_PORT:?}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_ENABLED: "true"
      AUTH_USERS: "${RB_AUTH:?}"
      AUTH_JWT_SECRET: "${RB_JWT:?}"
      PROXY: "${RB_PROXY:-}"
      NO_PROXY: "localhost,127.0.0.1,::1"
      GYING_HASH_SALT: "${RB_GYING_SALT:?}"
    volumes:
      - type: bind
        source: "${RB_DATA:?}"
        target: /app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
